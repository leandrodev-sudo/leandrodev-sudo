name: Update age badge

on:
  schedule:
    - cron: "0 6 * * *"   # roda todo dia às 6h UTC (~3h da manhã em BR)
  workflow_dispatch:        # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate age
        id: calc
        run: |
          BIRTH_DATE="2008-07-01"

          YEARS=$(( $(date -u +%Y) - $(date -u -d "$BIRTH_DATE" +%Y) ))
          TODAY_MMDD=$(date -u +%m%d)
          BIRTH_MMDD=$(date -u -d "$BIRTH_DATE" +%m%d)

          if [ $((10#$TODAY_MMDD)) -lt $((10#$BIRTH_MMDD)) ]; then
            YEARS=$((YEARS - 1))
            LAST_BIRTHDAY_YEAR=$(( $(date -u +%Y) - 1 ))
          else
            LAST_BIRTHDAY_YEAR=$(date -u +%Y)
          fi

          LAST_BIRTHDAY="${LAST_BIRTHDAY_YEAR}-07-01"
          NOW_TS=$(date -u +%s)
          LAST_BIRTHDAY_TS=$(date -u -d "$LAST_BIRTHDAY" +%s)
          DAYS_SINCE=$(( (NOW_TS - LAST_BIRTHDAY_TS) / 86400 ))

          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS_SINCE" >> "$GITHUB_OUTPUT"

      - name: Write badge JSON
        run: |
          mkdir -p assets
          echo "{\"schemaVersion\":1,\"label\":\"uptime\",\"message\":\"${{ steps.calc.outputs.years }} anos, ${{ steps.calc.outputs.days }} dias\",\"color\":\"fab387\"}" > assets/age.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/age.json
          git diff --staged --quiet && echo "Nada pra atualizar" || git commit -m "chore: atualiza badge de idade"
          git push
