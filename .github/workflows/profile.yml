name: Generate profile animations
 
on:
  schedule:
    - cron: "0 0 * * *"   # roda toda meia-noite UTC (~21h em BR)
  workflow_dispatch:        # permite rodar manualmente
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
 
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&count_private=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dracula
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
 
      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}